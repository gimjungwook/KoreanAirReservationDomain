<!DOCTYPE html>
<html lang="ko">
<head>

<title>OODP Iter3 (rev) · 14 · 라이브 데모</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .demo-grid { display: grid; grid-template-columns: 320px 1fr; gap: 30px; margin-top: 24px; flex: 1; min-height: 0; }
  .demo-side { display: flex; flex-direction: column; gap: 16px; }
  .demo-tabs { display: flex; flex-direction: column; gap: 10px; }
  .demo-tabs button { text-align: left; }
  .real-note { margin-top: auto; background: var(--subject-bg); border-radius: 12px; padding: 18px 20px; font-size: 18px; color: var(--fg-muted); line-height: 1.5; }
  .real-note b { color: var(--subject); }

</style>
</head>
<body>
<section class="slide" id="root">
  <header class="masthead"><span class="paper-cite">PART 3 · <b>라이브 데모 — 실제 콘솔 캡처</b></span><span class="slide-counter">18 / 22</span></header>
  <div class="slide-head" style="margin-top:104px">
    <span class="eyebrow new"><span class="dot"></span> 인터랙티브 — mockup 아님</span>
    <h1 class="slide-title" style="margin-bottom:0">Iter3DemoRunner를 실제로 돌린 출력.</h1>
  </div>

  <div class="demo-grid">
    <div class="demo-side">
      <div class="demo-tabs"></div>

    </div>
    <div class="console">
      <div class="cbar"><span class="dots"><i></i><i></i><i></i></span><span>iter3-demo-output · stdout</span></div>
      <div class="clog"></div>
    </div>
  </div>

</section>
