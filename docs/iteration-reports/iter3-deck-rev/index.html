<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OODP Iter3 (rev) · Korean Air Reservation · Observer — Live Deck</title>
<script src="deck-manifest.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #14141a; overflow: hidden;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", sans-serif; color: #0a0a0a;
  }
  #stage {
    position: fixed; top: 0; left: 0; width: 1920px; height: 1080px;
    transform-origin: top left; will-change: transform;
    background: #ffffff; box-shadow: 0 8px 60px rgba(0,0,0,0.55);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #ffffff; }

  .pv-btn {
    position: fixed; top: 16px; left: 16px; z-index: 110;
    background: rgba(20,20,22,0.9); color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: ui-sans-serif, sans-serif; opacity: 0.25; transition: opacity 0.2s ease;
  }
  .pv-btn:hover { opacity: 1; }

  .help-hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,22,0.9); color: rgba(255,255,255,0.92);
    padding: 10px 20px; border-radius: 999px; font-size: 13px; letter-spacing: 0.02em;
    z-index: 100; border: 1px solid rgba(255,255,255,0.12);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap;
  }
  .help-hint b { color: #ff7eb6; font-weight: 700; }
  .help-hint.show { opacity: 1; }

  #notes {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
    width: min(1100px, 92vw); background: rgba(20,20,22,0.95); color: #f2f2f4;
    border: 1px solid rgba(255,255,255,0.14); border-bottom: none; border-radius: 18px 18px 0 0;
    padding: 22px 30px 26px; z-index: 120;
    transition: transform 0.32s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 -12px 50px rgba(0,0,0,0.5);
  }
  #notes.show { transform: translate(-50%, 0); }
  #notes .nt-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
  #notes .nt-head b { color: #ff7eb6; font-weight: 700; }
  #notes .nt-body { font-size: 22px; line-height: 1.62; font-weight: 500; white-space: pre-line; }
</style>
</head>
<body>
<div id="stage"><iframe id="frame" src="" loading="eager"></iframe></div>
<div id="navLeft"  title="prev (←)" style="position:fixed;top:0;bottom:0;left:0;width:9%;z-index:60;cursor:w-resize;"></div>
<div id="navRight" title="next (→)" style="position:fixed;top:0;bottom:0;right:0;width:9%;z-index:60;cursor:e-resize;"></div>

<button class="pv-btn" id="pvBtn">🖥️ Presenter view</button>
<div class="help-hint" id="help">
  <b>← →</b> 이동 &nbsp;·&nbsp; <b>V</b> 발표자뷰 &nbsp;·&nbsp; <b>S</b> 노트 &nbsp;·&nbsp; <b>R</b> 재생 &nbsp;·&nbsp; <b>F</b> 전체화면 &nbsp;·&nbsp; <b>?</b> 도움말
</div>

<div id="notes">
  <div class="nt-head"><span id="nt-label">—</span><span><b>S</b> 닫기</span></div>
  <div class="nt-body" id="nt-body"></div>
</div>

<script>
  const manifest = window.DECK_MANIFEST;
  const DECK_VER = window.DECK_VER;
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const help = document.getElementById('help');
  const notes = document.getElementById('notes');
  const ntLabel = document.getElementById('nt-label');
  const ntBody = document.getElementById('nt-body');

  let idx = parseInt(localStorage.getItem('oodp3rev-idx') || '0', 10);
  if (idx < 0 || idx >= manifest.length) idx = 0;

  function resize() {
    const sw = window.innerWidth, sh = window.innerHeight;
    const scale = Math.min(sw / window.DECK_WIDTH, sh / window.DECK_HEIGHT);
    const x = Math.round((sw - window.DECK_WIDTH * scale) / 2);
    const y = Math.round((sh - window.DECK_HEIGHT * scale) / 2);
    stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }
  function render() {
    frame.src = manifest[idx].file + '?v=' + DECK_VER;
    ntLabel.innerHTML = `notes — <b>${idx + 1} / ${manifest.length}</b> · ${manifest[idx].label}`;
    ntBody.textContent = manifest[idx].notes || '(no notes)';
  }
  function publish() { localStorage.setItem('oodp3rev-idx', String(idx)); localStorage.setItem('oodp3rev-idx-ts', String(Date.now())); }
  function goTo(n) { idx = Math.max(0, Math.min(manifest.length - 1, n)); render(); publish(); }
  function next() { goTo(idx + 1); }
  function prev() { goTo(idx - 1); }
  function replay() { frame.src = manifest[idx].file + '?v=' + DECK_VER + '&r=' + Date.now(); }
  function openPresenter() { window.open('presenter.html', 'oodp3revpresenter', 'width=1180,height=820'); }

  function handleNavKey(e) {
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); goTo(0); }
    else if (k === 'End') { e.preventDefault(); goTo(manifest.length - 1); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); replay(); }
    else if (k === 's' || k === 'S') { e.preventDefault(); notes.classList.toggle('show'); }
    else if (k === 'v' || k === 'V') { e.preventDefault(); openPresenter(); }
    else if (k === 'f' || k === 'F') { e.preventDefault(); if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    else if (k === '?' || k === 'h' || k === 'H') { e.preventDefault(); help.classList.toggle('show'); }
  }
  window.addEventListener('keydown', handleNavKey, true);

  document.getElementById('navLeft').addEventListener('click', prev);
  document.getElementById('navRight').addEventListener('click', next);
  document.getElementById('pvBtn').addEventListener('click', openPresenter);

  let lastCmdTs = localStorage.getItem('oodp3rev-cmd-ts') || '0';
  setInterval(() => {
    const ts = localStorage.getItem('oodp3rev-cmd-ts');
    if (ts && ts !== lastCmdTs) {
      lastCmdTs = ts;
      let cmd; try { cmd = JSON.parse(localStorage.getItem('oodp3rev-cmd') || '{}'); } catch (_) { return; }
      if (cmd.a === 'next') next();
      else if (cmd.a === 'prev') prev();
      else if (cmd.a === 'goto' && typeof cmd.n === 'number') goTo(cmd.n);
      else if (cmd.a === 'replay') replay();
    }
  }, 180);

  window.addEventListener('load', () => { help.classList.add('show'); setTimeout(() => help.classList.remove('show'), 5000); });
  window.addEventListener('resize', resize);
  resize(); render(); publish();
</script>
</body>
</html>
