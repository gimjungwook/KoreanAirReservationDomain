  Open in browser. Keys: ← / → / Space / PgUp / PgDown / Home / End / 1-9 / P (print).

<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html",                       label: "Cover" },
    { file: "slides/02-feature-list.html",                label: "양식#1 — 전체 기능" },
    { file: "slides/03-extension-table.html",             label: "양식#2 — 확장기능" },
    { file: "slides/04-rdp-table.html",                   label: "양식#3 — Iter별 R/DP" },
    { file: "slides/05-roles.html",                       label: "역할 분담" },
    { file: "slides/06-usecase.html",                     label: "Use Case Diagram" },
    { file: "slides/07-uc-scenarios.html",                label: "UC 시나리오 5종" },
    { file: "slides/08-classdiagram.html",                label: "Class Diagram" },
    { file: "slides/09-class-detail.html",                label: "중요 클래스·메서드" },
    { file: "slides/10-observer-textbook-vs-team.html",   label: "Observer 교과서 vs 팀" },
    { file: "slides/11-observer-code.html",               label: "Observer 코드 전·후" },
    { file: "slides/12-state-impact.html",                label: "State 변화 영향" },
    { file: "slides/13-sequence-overview.html",           label: "Sequence — overview" },
    { file: "slides/14-seq-hold.html",                    label: "SC-01 Seat Hold Expiry" },

    { file: "slides/21-thanks.html",                      label: "감사합니다" },
  ];

  window.DECK_WIDTH = 1920;

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #FAFAFA;
    overflow: hidden;
    font-family: "Geist", "Inter", -apple-system, sans-serif;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform-origin: top left;
    will-change: transform;
    background: #fff;
    box-shadow: 0 12px 60px rgba(0,0,0,0.10);
    border-radius: 6px;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
    border-radius: 6px;
  }
  .counter {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #000;
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    z-index: 100;
    user-select: none;
    opacity: 0.85;
    transition: opacity 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .counter:hover { opacity: 1; }
  .counter .label { color: rgba(255,255,255,0.65); }
  .counter .grad-dot {
    width: 8px; height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, #7928CA, #FF0080);
  }
  .nav-zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 15%;
    cursor: pointer;
    z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
    color: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-zone.left  .nav-hint { left: 24px; }
  .nav-zone.right .nav-hint { right: 24px; }
  .nav-zone:hover .nav-hint { opacity: 1; }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; border-radius: 0; }
    iframe { border-radius: 0; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe {
      width: 1920px;
      height: 1080px;
      page-break-after: always;
      display: block;
    }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter"><span class="grad-dot"></span><span id="count-text">1 / 1</span></div>

<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const countText = document.getElementById('count-text');
  const printStack = document.getElementById('printStack');
  const storageKey = 'iter3-deck-' + location.pathname;
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    countText.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) {
      history.replaceState(null, '', '#' + (idx + 1));
    }
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
      default:
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (i < deck.length) { e.preventDefault(); show(i); }
        }
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
